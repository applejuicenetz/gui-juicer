name: Release

on:
  push:
    tags: ['v[0-9]*', '[0-9]*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate release tag and package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re
          tag = os.environ['RELEASE_TAG']
          version = tag.removeprefix('v')
          assert re.fullmatch(r'[0-9]+(?:\.[0-9]+)+', version), 'Invalid version tag'
          source = pathlib.Path('src/src.pro').read_text()
          actual = re.search(r'^VERSION\s*=\s*(\S+)', source, re.M).group(1)
          assert actual == version, f'Tag {tag} does not match source version {actual}'
          # Package scripts and metadata currently target 1.3.1; reject stale release names.
          assert version == '1.3.1', 'Update package paths and metadata for this version first'
          PY

  linux:
    needs: version
    name: Linux ${{ matrix.arch }} / Flatpak
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux archive and run tests
        run: sh packaging/build-linux.sh "${{ matrix.arch }}"
      - name: Install Flatpak tools and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder xvfb
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08
      - name: Build Flatpak bundle
        run: sh packaging/build-flatpak.sh
      - name: Smoke-test Flatpak
        run: |
          flatpak install --user --noninteractive -y --bundle "dist/juicer-1.3.1-linux-${{ matrix.arch }}.flatpak"
          xvfb-run -a sh -c '
            set +e
            timeout 20 flatpak run io.github.applejuicenetz.juicer
            result=$?
            test "$result" = 124
          '
      - uses: actions/upload-artifact@v4
        with:
          name: juicer-linux-${{ matrix.arch }}
          path: dist/juicer-1.3.1-linux-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: 1

  windows:
    needs: version
    name: Windows x86_64 setup

    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows executable and setup
        run: sh packaging/build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: juicer-windows-x86_64
          path: dist/juicer-1.3.1-windows-x86_64*.exe
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: juicer-*
          path: release-assets
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-assets
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 4
          mv juicer-1.3.1-windows-x86_64-setup.exe Juicer.setup.exe
          gh release create "$RELEASE_TAG" --verify-tag --title "Juicer $RELEASE_TAG" --generate-notes ./*

